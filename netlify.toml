# Netlify deployment configuration for NASEC ERP
# Frontend SPA built by Vite into dist/public
#
# The actual install + build logic lives in the `netlify-build` script
# inside package.json. Keeping the netlify.toml command short avoids
# any chance of Netlify truncating long inline commands.

[build]
  base = "."
  command = "npm run netlify-build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps --ignore-scripts"
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "true"
  NETLIFY_USE_PNPM = "false"
  NETLIFY_USE_YARN = "false"

# SPA fallback - wouter handles client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-busted assets can be cached aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always be revalidated
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
